<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="대박이와 함께 집중하는 타이머">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="대박이 타이머">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>대박이 타이머</title>
  <link rel="manifest" href="manifest.json">

  <!--
    부팅 중 흰 화면만 막는 검은 판이다. 인트로는 Dart가 그린다.

    토스 앱 안에서는 토스 자체 로딩 화면이 미니앱 위를 덮고 있어서 이 화면이
    보이지 않는다. 그래서 여기에 인트로를 그려봐야 아무도 못 본다 — 실제로
    한 번 그렇게 만들었다가 되돌렸다. 일반 브라우저에서는 Flutter가 첫 프레임을
    그릴 때까지 이 판이 흰 배경을 가려준다.
  -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000000;
    }
    #boot {
      position: fixed;
      inset: 0;
      background: #000000;
      transition: opacity 200ms ease;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="boot"></div>

  <script>
    // 인트로가 그려진 뒤 Dart가 호출한다 (lib/core/boot_screen.dart).
    window.hideBootScreen = function () {
      var el = document.getElementById('boot');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 200);
    };
  </script>

  <!-- 앱인토스 SDK. Flutter 시작 전에 window.AppsInTossModule이 준비되도록 동기 로드한다. -->
  <script src="js/apps_in_toss.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
