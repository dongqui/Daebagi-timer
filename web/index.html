<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="catodo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>대박이 타이머</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Flutter 엔진이 첫 프레임을 그리기 전까지 브라우저는 이 문서를 그대로 보여준다.
    아무것도 없으면 그동안 흰 화면이 뜬다. 그래서 인트로 화면을 정적 HTML로
    똑같이 한 벌 그려두고, Dart가 첫 프레임을 그린 뒤 크로스페이드로 넘긴다.

    수치는 lib/features/presentation/views/splash_screen.dart와 맞춰져 있다.
    한쪽만 고치면 넘어가는 순간에 위치가 튀므로 같이 고칠 것.

    별 배경은 이미지를 쓰지 않고 그라디언트로만 근사한다. parallax PNG 세 장은
    합쳐서 1MB에 가까워, 부팅을 빠르게 보이려고 넣은 화면이 오히려 부팅을
    늦추게 된다. 성기게 흩어진 별은 크로스페이드 중에 자연스럽게 나타난다.
  -->
  <link rel="preload" as="image" href="assets/assets/images/dog_cutout.webp">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000000;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* SpaceBackdrop의 RadialGradient(center: (0,-0.35), radius: 1.1) 근사 */
      background: radial-gradient(circle at 50% 32%, #14141c 0%, #000000 78%);
      transition: opacity 220ms ease;
      pointer-events: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      /* 인트로 등장 연출. Dart 쪽 TdsMotion.emphasized와 같은 곡선. */
      animation: boot-rise 700ms cubic-bezier(0.32, 0.72, 0, 1) both;
    }
    #boot img {
      width: 210px;
      height: auto;
      display: block;
    }
    #boot .title {
      margin-top: 26px;
      font-size: 24px;
      line-height: 32.4px;
      font-weight: 700;
      letter-spacing: -0.24px;
      color: #ffffff;
    }
    #boot .subtitle {
      margin-top: 8px;
      font-size: 15px;
      line-height: 22.5px;
      color: rgba(255, 255, 255, 0.5);
    }
    #boot .spinner {
      position: absolute;
      left: 50%;
      bottom: 80px;
      width: 36px;
      height: 36px;
      margin-left: -18px;
      border: 4px solid rgba(255, 255, 255, 0.14);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: boot-spin 900ms linear infinite;
    }
    @keyframes boot-rise {
      from { opacity: 0; transform: translateY(14px) scale(0.94); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    <img src="assets/assets/images/dog_cutout.webp" alt="">
    <div class="title">대박이 타이머</div>
    <div class="subtitle">대박이와 함께 집중해요</div>
    <div class="spinner"></div>
  </div>

  <script>
    // 등장 연출 길이. 위 #boot 애니메이션과 같은 값이어야 한다.
    var BOOT_RISE_MS = 700;

    // Dart 쪽에서 첫 프레임을 그린 뒤 호출한다 (lib/core/boot_screen.dart).
    //
    // 곧바로 지우지 않고 겹친 채로 흐려지게 해서, 폰트 렌더링 차이 같은 자잘한
    // 어긋남이 눈에 띄지 않게 한다. 등장 연출이 아직 진행 중이면 그게 끝날 때까지
    // 기다린다 — 올라오는 도중에 걷어내면 Dart 쪽 캐릭터는 이미 제자리에 있어서
    // 한 번 튄다.
    window.hideBootScreen = function () {
      var el = document.getElementById('boot');
      if (!el) return;

      var remaining = Math.max(0, BOOT_RISE_MS - performance.now());
      setTimeout(function () {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 240);
      }, remaining);
    };
  </script>

  <!-- 앱인토스 SDK. Flutter 시작 전에 window.AppsInTossModule이 준비되도록 동기 로드한다. -->
  <script src="js/apps_in_toss.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
