name: catodo
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.0
  fl_chart: ^0.71.0
  wakelock_plus: ^1.3.2
  flutter_localizations:
    sdk: flutter
  intl: any
  flame: ^1.28.1
  # firebase_core: ^3.15.1
  # firebase_auth: ^5.6.2
  # cloud_firestore: ^5.6.11
  # firebase_storage: ^12.4.9
  # cloud_functions: ^5.6.1
  # google_sign_in: ^7.1.1
  # sign_in_with_apple: ^7.0.1
  flutter_dotenv: ^5.2.1
  http: ^1.4.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    # 홈/타이머 Flame + UI에 실제로 쓰는 이미지만 포함 (와일드카드 assets/images/ 사용 안 함)
    - assets/images/characters/
    - assets/images/icons/
    - assets/images/parallax/
    - assets/images/planet.png
    # 인트로 화면 캐릭터. 원본 dog_photo_cutout.png는 알파가 없어 번들에 넣지 않는다.
    - assets/images/dog_cutout.webp
    - assets/images/flowstar_left.png
    - assets/images/flowstar_right.png
    - assets/images/star_1.png
    - assets/images/star_2.png
    - assets/images/star_2_5.png
    - assets/images/star_3.png
    - assets/sounds/
